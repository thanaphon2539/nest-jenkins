services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: jenkins-docker:lts
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # ✅ แค่ socket พอ
    restart: unless-stopped

  nestapp:
    build: .
    image: nestapp:latest   # ✅ กำหนดชื่อ image ให้คงที่
    container_name: nestapp
    command: ['pnpm', 'start:prod']
    ports:
      - "3005:3005"
    restart: unless-stopped


volumes:
  jenkins_home:
